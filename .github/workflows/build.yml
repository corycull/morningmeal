name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: morningmeal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Also keep the latest APK on the `apk` branch, so it can be fetched with plain git.
      - name: Publish APK to the apk branch
        run: |
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/Morningmeal-debug.apk
          cd out
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Morningmeal-debug.apk
          git commit -q -m "Debug APK from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
